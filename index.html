<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Skyco Business Suite</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%233B5BDB'/%3E%3Cpath fill='%23fff' d='M32 14L4 34L28 30Z'/%3E%3Cpath fill='%23fff' d='M32 14L60 34L36 30Z'/%3E%3Cpath fill='%23fff' d='M32 30L24 48L32 40L40 48Z'/%3E%3C/svg%3E">
<style>
  :root{
    --bg:#FAFBFB; --surface:#FFFFFF; --text:#1C1C1E; --text-soft:#6E6E73; --text-faint:#9C9CA1;
    --border:#E5E5E7; --border-soft:#EFEFF0; --accent:#3B5BDB; --accent-soft:#EEF1FD;
    --success:#2F9E44; --success-soft:#EBF7EE; --warning:#E8590C; --warning-soft:#FDF1EA;
    --danger:#E03131; --danger-soft:#FBECEC; --radius:9px; --radius-sm:6px;
    --shadow:0 1px 2px rgba(0,0,0,0.04), 0 1px 8px rgba(0,0,0,0.03);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;height:100%;}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Inter",system-ui,sans-serif;
    background:var(--bg); color:var(--text); font-size:14px; line-height:1.5;
    -webkit-font-smoothing:antialiased;
  }
  #app{display:flex; height:100vh; overflow:hidden;}
  ::-webkit-scrollbar{width:8px;height:8px;}
  ::-webkit-scrollbar-thumb{background:#DCDCDE;border-radius:8px;}
  ::-webkit-scrollbar-track{background:transparent;}

  #sidebar{
    width:222px; flex:none; background:var(--surface); border-right:1px solid var(--border);
    display:flex; flex-direction:column; padding:18px 12px; overflow-y:auto;
  }
  .brand{display:flex;align-items:center;gap:8px;padding:4px 8px 20px;}
  .brand-mark{width:26px;height:26px;border-radius:7px;background:var(--accent);
    display:flex;align-items:center;justify-content:center;color:#fff;font-weight:600;font-size:12px;flex:none;padding:5px;box-sizing:border-box;}
  .brand-name{font-weight:600;font-size:14.5px;letter-spacing:-0.01em;}
  .nav-group{margin-bottom:18px;}
  .nav-label{font-size:11px;color:var(--text-faint);padding:0 10px 6px;font-weight:600;letter-spacing:0.02em;}
  .nav-item{
    display:flex;align-items:center;gap:9px;padding:7px 10px;border-radius:var(--radius-sm);
    color:var(--text-soft);cursor:pointer;font-size:13.5px;font-weight:500;user-select:none;
  }
  .nav-item svg{width:16px;height:16px;flex:none;opacity:0.85;}
  .nav-item:hover{background:var(--border-soft);color:var(--text);}
  .nav-item.active{background:var(--accent-soft);color:var(--accent);}
  .nav-item.active svg{opacity:1;}
  .sidebar-foot{margin-top:auto;padding:10px;font-size:11px;color:var(--text-faint);}

  #main{flex:1;overflow-y:auto;position:relative;min-width:0;}
  .topbar{
    position:sticky;top:0;z-index:5;background:rgba(250,251,251,0.85);backdrop-filter:blur(8px);
    border-bottom:1px solid var(--border-soft); padding:16px 32px;display:flex;align-items:center;justify-content:space-between;gap:10px;
  }
  .topbar-left{display:flex;align-items:center;gap:10px;min-width:0;}
  .page-title{font-size:19px;font-weight:650;letter-spacing:-0.015em;}
  .page-sub{font-size:12.5px;color:var(--text-soft);margin-top:2px;}
  .content{padding:24px 32px 60px;max-width:1220px;}
  .hamburger-btn{display:none;flex:none;border:1px solid var(--border);background:var(--surface);border-radius:var(--radius-sm);padding:7px 9px;}
  .hamburger-btn svg{width:18px;height:18px;display:block;}
  .sidebar-backdrop{position:fixed;inset:0;background:rgba(20,20,22,0.4);z-index:35;opacity:0;pointer-events:none;transition:opacity .2s;}
  .sidebar-backdrop.show{opacity:1;pointer-events:auto;}

  @media (max-width: 860px){
    .hamburger-btn{display:inline-flex;align-items:center;justify-content:center;}
    #sidebar{position:fixed;top:0;left:0;height:100vh;z-index:40;transform:translateX(-100%);transition:transform .22s ease;box-shadow:0 0 30px rgba(0,0,0,0.15);}
    #sidebar.open{transform:translateX(0);}
    .topbar{padding:12px 16px;}
    .content{padding:16px 16px 60px;}
    .stat-grid{grid-template-columns:repeat(2,1fr);}
    .page-title{font-size:17px;}
  }

  button{font-family:inherit;cursor:pointer;}
  .btn{
    border:1px solid var(--border);background:var(--surface);color:var(--text);
    padding:7px 13px;border-radius:var(--radius-sm);font-size:13px;font-weight:500;
    display:inline-flex;align-items:center;gap:6px;transition:background .12s,border-color .12s;
    text-decoration:none;
  }
  .btn:hover{background:var(--border-soft);}
  .btn-primary{background:var(--accent);color:#fff;border-color:var(--accent);}
  .btn-primary:hover{background:#3251c4;}
  .btn-danger{color:var(--danger);}
  .btn-danger:hover{background:var(--danger-soft);border-color:var(--danger-soft);}
  .btn-sm{padding:5px 9px;font-size:12px;}
  .btn-ghost{border-color:transparent;background:transparent;}
  .btn-ghost:hover{background:var(--border-soft);}
  .btn:disabled{opacity:0.45;cursor:not-allowed;}

  input,select,textarea{
    font-family:inherit;font-size:13.5px;color:var(--text);background:var(--surface);
    border:1px solid var(--border);border-radius:var(--radius-sm);padding:8px 10px;width:100%;
  }
  input:focus,select:focus,textarea:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft);}
  label{font-size:12px;color:var(--text-soft);font-weight:600;display:block;margin-bottom:5px;}
  .field{margin-bottom:14px;}
  .row{display:flex;gap:12px;}
  .row > .field{flex:1;}
  .row3 > .field{flex:1;}

  .card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:18px 20px;}
  .card + .card{margin-top:14px;}
  .card-title{font-weight:650;font-size:14px;margin-bottom:4px;}

  .stat-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:20px;}
  .stat-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:16px 18px;}
  .stat-label{font-size:12px;color:var(--text-soft);font-weight:600;margin-bottom:8px;}
  .stat-value{font-size:24px;font-weight:650;letter-spacing:-0.02em;font-variant-numeric:tabular-nums;}
  .stat-value.receivable{color:var(--accent);}
  .stat-value.payable{color:var(--warning);}
  .stat-value.overdue{color:var(--danger);}

  table{width:100%;border-collapse:collapse;font-size:13.5px;}
  thead th{
    text-align:left;font-size:11.5px;color:var(--text-faint);font-weight:600;
    padding:0 12px 8px;border-bottom:1px solid var(--border);letter-spacing:0.01em;white-space:nowrap;
  }
  tbody td{padding:11px 12px;border-bottom:1px solid var(--border-soft);vertical-align:middle;}
  tbody tr:hover{background:#FBFBFC;}
  tbody tr:last-child td{border-bottom:none;}
  td.num,th.num{text-align:right;font-variant-numeric:tabular-nums;}
  .table-scroll{overflow-x:auto;}

  .badge{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:20px;font-size:11.5px;font-weight:600;white-space:nowrap;}
  .badge-draft{background:var(--border-soft);color:var(--text-soft);}
  .badge-sent{background:var(--accent-soft);color:var(--accent);}
  .badge-paid{background:var(--success-soft);color:var(--success);}
  .badge-partial{background:var(--warning-soft);color:var(--warning);}
  .badge-overdue{background:var(--danger-soft);color:var(--danger);}
  .badge-void{background:var(--border-soft);color:var(--text-faint);text-decoration:line-through;}
  .doc-tag{display:inline-block;padding:2px 7px;border-radius:5px;font-size:11px;font-weight:700;letter-spacing:0.02em;white-space:nowrap;}
  .tag-QT{background:#F1F3F5;color:#495057;}
  .tag-PO{background:#F3EAFB;color:#862EB0;}
  .tag-DO{background:#EAF3FB;color:#1971C2;}
  .tag-INV{background:var(--accent-soft);color:var(--accent);}
  .tag-CN{background:var(--success-soft);color:var(--success);}
  .tag-DN{background:var(--warning-soft);color:var(--warning);}
  .tag-PINV{background:#F3EAFB;color:#862EB0;}
  .tag-RCT{background:var(--success-soft);color:var(--success);}
  .tag-PMT{background:var(--warning-soft);color:var(--warning);}
  .cur-badge{font-size:10.5px;font-weight:700;color:var(--text-faint);border:1px solid var(--border);border-radius:4px;padding:1px 5px;margin-left:5px;}

  .toolbar{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:16px;flex-wrap:wrap;}
  .filters{display:flex;gap:8px;flex-wrap:wrap;}
  .filters select,.filters input{width:auto;min-width:110px;}
  .search-input{width:220px !important;}

  .empty{text-align:center;padding:60px 20px;color:var(--text-faint);}
  .empty-icon{font-size:28px;margin-bottom:10px;}
  .empty-title{font-size:14px;color:var(--text-soft);font-weight:600;margin-bottom:4px;}
  .empty-sub{font-size:12.5px;}

  .modal-overlay{
    position:fixed;inset:0;background:rgba(20,20,22,0.35);display:flex;align-items:flex-start;
    justify-content:center;z-index:50;padding:40px 20px;overflow-y:auto;
  }
  .modal{
    background:var(--surface);border-radius:12px;width:100%;max-width:640px;
    box-shadow:0 20px 60px rgba(0,0,0,0.18); border:1px solid var(--border);
  }
  .modal.wide{max-width:980px;}
  .modal-head{padding:18px 22px;border-bottom:1px solid var(--border-soft);display:flex;align-items:center;justify-content:space-between;}
  .modal-title{font-size:15.5px;font-weight:650;}
  .modal-body{padding:20px 22px;max-height:74vh;overflow-y:auto;}
  .modal-foot{padding:16px 22px;border-top:1px solid var(--border-soft);display:flex;justify-content:flex-end;gap:8px;flex-wrap:wrap;}
  .icon-btn{background:none;border:none;color:var(--text-faint);font-size:18px;line-height:1;padding:2px 6px;border-radius:5px;}
  .icon-btn:hover{background:var(--border-soft);color:var(--text);}

  .items-table th,.items-table td{padding:6px 6px;}
  .items-table input,.items-table select{padding:6px 7px;font-size:12.5px;}
  .items-table .colNo{width:28px;color:var(--text-faint);font-size:12px;text-align:center;}
  .items-table .colCode{width:150px;}
  .items-table .colDesc{min-width:190px;}
  .items-table .colQty{width:90px;}
  .items-table .colUnit{width:66px;}
  .items-table .colPrice{width:100px;}
  .items-table .colDisc{width:118px;}
  .items-table .disc-wrap{display:flex;gap:4px;}
  .items-table .disc-wrap input{width:60%;}
  .items-table .disc-wrap select{width:40%;padding:6px 3px;}
  .items-table .colAmt{width:100px;text-align:right;font-variant-numeric:tabular-nums;padding-right:6px;font-weight:600;}
  .totals-box{margin-top:10px;margin-left:auto;width:280px;}
  .totals-row{display:flex;justify-content:space-between;padding:5px 0;font-size:13.5px;}
  .totals-row.grand{font-weight:700;font-size:15px;border-top:1px solid var(--border);margin-top:5px;padding-top:9px;}

  .tabs{display:flex;gap:2px;border-bottom:1px solid var(--border);margin-bottom:18px;}
  .tab{padding:9px 14px;font-size:13px;font-weight:600;color:var(--text-soft);border-bottom:2px solid transparent;cursor:pointer;}
  .tab:hover{color:var(--text);}
  .tab.active{color:var(--accent);border-bottom-color:var(--accent);}

  .party-type-tag{font-size:10.5px;font-weight:700;padding:2px 6px;border-radius:5px;letter-spacing:0.02em;}
  .pt-customer{background:var(--accent-soft);color:var(--accent);}
  .pt-supplier{background:#F3EAFB;color:#862EB0;}
  .pt-both{background:var(--success-soft);color:var(--success);}

  .chip-list{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px;}
  .chip{background:var(--border-soft);border-radius:20px;padding:4px 10px 4px 12px;font-size:12px;display:flex;align-items:center;gap:6px;}
  .chip button{background:none;border:none;color:var(--text-faint);font-size:14px;line-height:1;padding:0;}
  .add-chip-row{display:flex;gap:6px;margin-top:8px;}
  .add-chip-row input{flex:1;}

  .aging-bucket{font-weight:700;font-variant-numeric:tabular-nums;}
  .bucket-current{color:var(--text-soft);}
  .bucket-1{color:var(--warning);}
  .bucket-2{color:#E8590C;}
  .bucket-3{color:var(--danger);}

  #printSheet{display:none;}
  @media print{
    body *{visibility:hidden;}
    #printSheet, #printSheet *{visibility:visible;}
    #printSheet{display:block;position:absolute;top:0;left:0;width:100%;padding:0;}
  }
  .doc-paper{padding:50px 55px;font-size:13px;color:#1c1c1e;}
  .doc-paper-head{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:34px;}
  .doc-paper h1{font-size:22px;margin:0 0 4px;letter-spacing:-0.01em;}
  .doc-paper .co-name{font-size:16px;font-weight:700;margin-bottom:4px;}
  .doc-paper .co-detail{font-size:12px;color:#555;line-height:1.5;}
  .doc-meta-table{font-size:12.5px;}
  .doc-meta-table td{padding:2px 0;}
  .doc-meta-table td:first-child{color:#777;padding-right:14px;}
  .doc-paper table.items{width:100%;border-collapse:collapse;margin:18px 0;}
  .doc-paper table.items th{text-align:left;font-size:11px;color:#777;border-bottom:1.5px solid #222;padding:6px 8px;}
  .doc-paper table.items td{padding:8px;border-bottom:1px solid #eee;font-size:12.5px;}
  .doc-paper table.items td.num,.doc-paper table.items th.num{text-align:right;}
  .doc-paper .totals{width:260px;margin-left:auto;font-size:12.5px;}
  .doc-paper .totals div{display:flex;justify-content:space-between;padding:4px 0;}
  .doc-paper .totals .grand{font-weight:700;font-size:15px;border-top:1.5px solid #222;margin-top:4px;padding-top:8px;}
  .doc-paper .notes{margin-top:26px;font-size:12px;color:#555;}
  .doc-paper .party-block{font-size:12.5px;}
  .doc-paper .party-label{font-size:10.5px;color:#999;text-transform:uppercase;letter-spacing:0.04em;margin-bottom:4px;}

  .toast{
    position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:#1C1C1E;color:#fff;
    padding:10px 18px;border-radius:8px;font-size:13px;z-index:100;box-shadow:0 8px 24px rgba(0,0,0,0.2);
    opacity:0;pointer-events:none;transition:opacity .2s, transform .2s;
  }
  .toast.show{opacity:1;transform:translateX(-50%) translateY(-4px);}

  .hint{font-size:12px;color:var(--text-faint);margin-top:6px;}
  a.link{color:var(--accent);text-decoration:none;cursor:pointer;font-weight:500;}
  a.link:hover{text-decoration:underline;}
</style>
</head>
<body>
<div id="app"></div>
<div id="toast" class="toast"></div>
<div id="printSheet"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script>
/* ================= Supabase config =================
   Fill these in with your own Supabase project's values (Project Settings → API).
   SUPABASE_ANON_KEY is safe to expose in client-side code — it's the public key,
   access is controlled by Row Level Security policies on the table, not by hiding this key. */
   const SUPABASE_URL = "https://rxeclgzywxpoegadrnik.supabase.co";        // e.g. "https://abcdefgh.supabase.co"
const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJ4ZWNsZ3p5d3hwb2VnYWRybmlrIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTA1MTY1MTksImV4cCI6MjEwNjA5MjUxOX0.hHzGh-dX_vFbz9th_Ayoq3KqVHkzdKlymL8xKvEiMjY"; // e.g. "eyJhbGciOi..."
const SUPABASE_CONFIGURED = !SUPABASE_URL.includes('YOUR_SUPABASE') && !SUPABASE_ANON_KEY.includes('YOUR_SUPABASE');
const sb = SUPABASE_CONFIGURED ? window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY) : null;

/* ================= Defaults ================= */
const DEFAULT_ITEM_CATALOG = {
  codes: [
    {code:'RUC', name:"RAW BIRD'S NEST"},
    {code:'RC',  name:"CLEANED BIRD'S NEST"},
    {code:'FC',  name:"FRESH BIRD'S NEST"},
    {code:'BTL', name:"BOTTLED BIRD'S NEST"},
    {code:'OTR', name:"OTHER"},
  ],
  gradesByCode: {
    RUC: ['A','AB','ABC','BC','PTH','HEAVY','LUMUT','BAO','MASS'],
    RC:  ['3A','4A','4AX','5A','5AX','6A','6AX','7A','8A','BB','AA'],
    FC:  ['A','AB','ABC','BC','PTH','HEAVY','LUMUT','BAO','MASS'],
    BTL: [],
    OTR: [],
  },
  colors: ['WHITE','BEIGE','YELLOW','WHITE BEIGE','BEIGE YELLOW'],
  units: ['g','kg','pc','bottle'],
};

const DEFAULT_SETTINGS = {
  companyName: "The Skyco",
  address: "No. 1, Jalan Contoh, 41000 Klang, Selangor",
  phone: "+60 3-1234 5678",
  email: "hello@yourcompany.com",
  regNoNew: "202601012345 (New)",
  regNoOld: "1234567-A (Old)",
  bankName: "Maybank",
  bankAccount: "5123 4567 8901",
  taxLabel: "SST",
  taxRate: 6,
  currency: "RM",
  currencies: ["RM","USD","SGD","CNY","EUR","GBP","IDR"],
  paymentMethods: ["Cash","Bank Transfer","Cheque","Online","Cash Deposit"],
  docTypes: {
    QT:   { label: "Quotation",       prefix: "QT",   next: 1 },
    PO:   { label: "Purchase Order",  prefix: "PO",   next: 1 },
    DO:   { label: "Delivery Order",  prefix: "DO",   next: 1 },
    INV:  { label: "Invoice",         prefix: "INV",  next: 1 },
    CN:   { label: "Credit Note",     prefix: "CN",   next: 1 },
    DN:   { label: "Debit Note",      prefix: "DN",   next: 1 },
    PINV: { label: "Purchase Bill",   prefix: "PINV", next: 1 },
    RCT:  { label: "Receipt",         prefix: "RCT",  next: 1 },
    PMT:  { label: "Payment Voucher", prefix: "PMT",  next: 1 },
  },
  numberFormat: "{PREFIX}-{YYYY}-{SEQ}",
  itemCatalog: DEFAULT_ITEM_CATALOG,
};

const DOC_LABELS = { QT:'Quotation', PO:'Purchase Order', DO:'Delivery Order', INV:'Invoice', CN:'Credit Note', DN:'Debit Note', PINV:'Purchase Bill' };
const MONEY_DOC_TYPES = ['INV','CN','DN','PINV']; // QT, PO, DO are non-monetary / pre-conversion documents

/* ================= State & storage ================= */
let state = { settings:null, parties:[], documents:[], payments:[], stockMovements:[], recurring:[], cashMovements:[], counterPreview:{}, loaded:false };

async function dbGet(key){
  try{
    const { data, error } = await sb.from('kv_store').select('value').eq('key', key).maybeSingle();
    if(error){ console.error('dbGet', key, error); return null; }
    return data ? data.value : null;
  }catch(e){ console.error('dbGet', key, e); return null; }
}
async function dbSet(key, value){
  try{
    const { error } = await sb.from('kv_store').upsert({ key, value, updated_at: new Date().toISOString() });
    if(error){ console.error('dbSet', key, error); toast('Could not save — check your connection'); }
  }catch(e){ console.error('dbSet', key, e); toast('Could not save — check your connection'); }
}
async function loadAll(){
  const [s,p,d,pay,sm,rc,cm] = await Promise.all([
    dbGet('settings'), dbGet('parties'), dbGet('documents'), dbGet('payments'), dbGet('stockMovements'), dbGet('recurring'), dbGet('cashMovements')
  ]);
  state.settings = s ? deepMerge(JSON.parse(JSON.stringify(DEFAULT_SETTINGS)), s) : JSON.parse(JSON.stringify(DEFAULT_SETTINGS));
  state.parties = p || [];
  state.documents = d || [];
  state.payments = pay || [];
  state.stockMovements = sm || [];
  state.recurring = rc || [];
  state.cashMovements = cm || [];
  state.loaded = true;
}
function deepMerge(base, override){
  if(Array.isArray(base)) return override!==undefined? override : base;
  if(typeof base==='object' && base!==null){
    const out = {...base};
    for(const k in override||{}) out[k] = deepMerge(base[k], override[k]);
    return out;
  }
  return override!==undefined? override : base;
}
async function saveSettings(){ await dbSet('settings', state.settings); }
async function saveParties(){ await dbSet('parties', state.parties); }
async function saveDocuments(){ await dbSet('documents', state.documents); }
async function savePayments(){ await dbSet('payments', state.payments); }
async function saveStock(){ await dbSet('stockMovements', state.stockMovements); }
async function saveRecurring(){ await dbSet('recurring', state.recurring); }
async function saveCash(){ await dbSet('cashMovements', state.cashMovements); }

function uid(){ return Math.random().toString(36).slice(2,10) + Date.now().toString(36).slice(-4); }
function todayStr(){ return new Date().toISOString().slice(0,10); }

/* Running numbers live in the Supabase "counters" table, not in local state, so two
   people creating a document at the same instant can never get the same number — the
   database increments each counter atomically (row-locked), one caller at a time. */
function formatDocNumber(type, seq){
  const dt = state.settings.docTypes[type];
  const year = new Date().getFullYear();
  const seqStr = String(seq).padStart(4,'0');
  return state.settings.numberFormat.replace('{PREFIX}', dt.prefix).replace('{YYYY}', year).replace('{SEQ}', seqStr);
}
async function getNextNumber(type){
  const { data, error } = await sb.rpc('next_doc_seq', { p_doc_type: type });
  if(error){ console.error('next_doc_seq', error); toast('Could not get the next number — check your connection and try again'); throw error; }
  return formatDocNumber(type, data);
}
async function peekNextSeq(type){
  const { data, error } = await sb.rpc('peek_doc_seq', { p_doc_type: type });
  if(error){ console.error('peek_doc_seq', error); return null; }
  return data;
}
async function refreshCounterPreviews(){
  const types = Object.keys(state.settings.docTypes);
  const results = await Promise.all(types.map(t=>peekNextSeq(t)));
  types.forEach((t,i)=>{ state.counterPreview[t] = results[i]; });
  if(route.page==='settings') render();
}

function fmtMoney(n, currency){
  currency = currency || state.settings.currency;
  const v = (Math.round((n + Number.EPSILON) * 100) / 100).toFixed(2);
  const parts = v.split('.');
  parts[0] = parts[0].replace(/\B(?=(\d{3})+(?!\d))/g, ',');
  return currency + ' ' + parts.join('.');
}
function fmtDate(d){
  if(!d) return '—';
  const dt = new Date(d+'T00:00:00');
  return dt.toLocaleDateString('en-MY', {day:'2-digit', month:'short', year:'numeric'});
}
function daysBetween(a,b){ return Math.round((new Date(b+'T00:00:00') - new Date(a+'T00:00:00'))/86400000); }
function toast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  clearTimeout(toast._t);
  toast._t = setTimeout(()=>t.classList.remove('show'), 2400);
}

/* ================= Item catalog helpers ================= */
function itemName(code){ const it = state.settings.itemCatalog.codes.find(c=>c.code===code); return it? it.name : code; }
function gradesForCode(code){
  const cat = state.settings.itemCatalog;
  const gbc = cat.gradesByCode || {};
  if(code && gbc[code]) return gbc[code];
  if(!code){ // no code chosen yet — offer the union of all grades
    const all = new Set(); Object.values(gbc).forEach(list=>(list||[]).forEach(g=>all.add(g))); return [...all];
  }
  return [];
}
function composeDesc(code, grade, color){
  if(!code) return '';
  const parts = [grade, color].filter(Boolean).join(' ');
  return itemName(code) + (parts ? ' - ' + parts : '');
}
function lineBase(it){ return (Number(it.qty)||0) * (Number(it.price)||0); }
function lineDiscountAmt(it){
  const base = lineBase(it);
  if(it.discountType==='pct') return base * (Number(it.discount)||0) / 100;
  return Number(it.discount)||0;
}
function lineAmount(it){ return Math.max(0, lineBase(it) - lineDiscountAmt(it)); }
function docTotals(doc){
  const subtotal = doc.items.reduce((s,it)=> s + lineAmount(it), 0);
  const tax = subtotal * (Number(doc.taxRate)||0) / 100;
  return { subtotal, tax, total: subtotal + tax };
}
function docCurrency(doc){ return doc.currency || state.settings.currency; }

/* ================= Documents / ledger domain ================= */
function docPaidAmount(doc){
  return state.payments.filter(p=>p.linkedDocId===doc.id && !p.voided).reduce((s,p)=>s+Number(p.amount),0);
}
function docStatus(doc){
  if(doc.voided) return 'void';
  if(doc.type==='QT' || doc.type==='PO' || doc.type==='DO') return doc.status||'draft';
  if(doc.type==='CN' || doc.type==='DN') return doc.status||'sent';
  const {total} = docTotals(doc);
  const paid = docPaidAmount(doc);
  if(doc.status==='draft') return 'draft';
  if(paid <= 0){ if(doc.dueDate && doc.dueDate < todayStr()) return 'overdue'; return 'sent'; }
  if(paid >= total - 0.005) return 'paid';
  return 'partial';
}
// Outstanding (not fully paid, not voided) Invoices (AR) or Purchase Bills (AP) for a party —
// used by the bulk "knock off" payment flow so several bills can be settled in one go.
function outstandingDocsFor(partyId, kind){
  const type = kind==='AP' ? 'PINV' : 'INV';
  return state.documents.filter(d=>d.partyId===partyId && d.type===type && !d.voided).map(d=>{
    const t = docTotals(d); const paid = docPaidAmount(d); const balance = t.total - paid;
    return { doc:d, total:t.total, paid, balance, ccy: docCurrency(d) };
  }).filter(r=>r.balance > 0.005).sort((a,b)=>a.doc.date.localeCompare(b.doc.date));
}
function badgeClass(status){
  return {draft:'badge-draft', sent:'badge-sent', paid:'badge-paid', partial:'badge-partial', overdue:'badge-overdue', void:'badge-void'}[status] || 'badge-draft';
}
function partyName(id){ const p = state.parties.find(p=>p.id===id); return p? p.name : '—'; }
function partyById(id){ return state.parties.find(p=>p.id===id); }

function isFromDO(doc){
  if(!doc.linkedFrom) return false;
  const src = state.documents.find(d=>d.id===doc.linkedFrom);
  return src && src.type==='DO';
}
function stockEffectType(doc){
  if(doc.type==='DO') return 'out';
  if(doc.type==='INV' && !isFromDO(doc)) return 'out';
  if(doc.type==='CN') return 'in';
  if(doc.type==='PINV') return 'in';
  return null;
}
function skuKey(code,grade,color){ return [code||'', grade||'', color||''].join('|'); }
function recordStockMovements(doc, reverse){
  const type = stockEffectType(doc);
  if(!type) return;
  doc.items.forEach(it=>{
    if(!it.itemCode) return;
    const qty = Math.abs(Number(it.qty)||0);
    if(!qty) return;
    const sign = (type==='out' ? -1 : 1) * (reverse ? -1 : 1);
    state.stockMovements.push({ id:uid(), date:doc.date, sku:skuKey(it.itemCode,it.grade,it.color),
      itemCode:it.itemCode, grade:it.grade||'', color:it.color||'', unit:it.unit||'g',
      qty: sign*qty, ref:doc.number, docId:doc.id, note:DOC_LABELS[doc.type], createdAt:Date.now() });
  });
}
function stockOnHand(sku){
  return state.stockMovements.filter(m=>m.sku===sku).reduce((s,m)=>s+Number(m.qty),0);
}
function allSkusInUse(){
  const set = new Map();
  state.stockMovements.forEach(m=>{
    if(!set.has(m.sku)) set.set(m.sku, {sku:m.sku, itemCode:m.itemCode, grade:m.grade, color:m.color, unit:m.unit});
  });
  return [...set.values()];
}

/* ================= Cash movements ================= */
// Tracks all money movement, however it was paid — cash, bank transfer, cheque, or online —
// not just physical cash. "Method" (below) records which one; the balance is their combined total.
const CASH_CATEGORIES = ['Sales receipt','Owner capital','Loan received','Petty cash top-up','Other income',
  'Supplier payment','Rent','Utilities','Salary/Wages','Transport/Delivery','Owner drawings','Bank fees','Other expense'];
function paymentMethods(){
  const list = state.settings.paymentMethods;
  return (list && list.length) ? list : ['Cash','Bank Transfer','Cheque','Online'];
}
function cashMovementsSorted(){ return [...state.cashMovements].filter(m=>!m.voided).sort((a,b)=> b.date.localeCompare(a.date) || (b.createdAt-a.createdAt)); }
function cashBalanceFor(currency){
  currency = currency || state.settings.currency;
  return state.cashMovements.filter(m=>!m.voided && (m.currency||state.settings.currency)===currency)
    .reduce((s,m)=> s + (m.direction==='in' ? Number(m.amount) : -Number(m.amount)), 0);
}
function cashBalancesByCurrency(){
  const ccys = [...new Set(state.cashMovements.filter(m=>!m.voided).map(m=>m.currency||state.settings.currency))];
  const out = {};
  ccys.forEach(c=>{ out[c] = cashBalanceFor(c); });
  return out;
}

// Receivables (AR) and payables (AP) are kept as two fully separate ledgers, even for a
// party that is both your customer and your supplier — an invoice you sent them and a bill
// they sent you are two different obligations and must never net against each other.
const AR_DOC_TYPES = ['INV','DN','CN'];
const AP_DOC_TYPES = ['PINV'];
function ledgerRows(partyId, kind){
  const docTypes = kind==='AP' ? AP_DOC_TYPES : AR_DOC_TYPES;
  const paymentType = kind==='AP' ? 'PMT' : 'RCT';
  const rows = [];
  state.documents.filter(d=>d.partyId===partyId && docTypes.includes(d.type) && !d.voided).forEach(d=>{
    const {total} = docTotals(d);
    let effect = 0;
    if(d.type==='INV' || d.type==='DN' || d.type==='PINV') effect = total;
    else if(d.type==='CN') effect = -total;
    rows.push({ date:d.date, ref:d.number, desc:DOC_LABELS[d.type], currency:docCurrency(d), debit: effect>0?effect:0, credit: effect<0?-effect:0 });
  });
  state.payments.filter(p=>p.partyId===partyId && p.type===paymentType && !p.voided).forEach(p=>{
    rows.push({ date:p.date, ref:p.number, desc: p.type==='RCT'?'Receipt':'Payment', currency:p.currency||state.settings.currency, debit:0, credit:Number(p.amount) });
  });
  rows.sort((a,b)=> a.date.localeCompare(b.date));
  const runningByCcy = {};
  rows.forEach(r=>{ runningByCcy[r.currency] = (runningByCcy[r.currency]||0) + r.debit - r.credit; r.balance = runningByCcy[r.currency]; });
  return rows;
}
function ledgerRowsByCurrency(partyId, kind){
  const rows = ledgerRows(partyId, kind);
  const grouped = {};
  rows.forEach(r=>{ (grouped[r.currency] = grouped[r.currency]||[]).push(r); });
  return grouped;
}
function partyBalance(partyId, kind, currency){
  currency = currency || state.settings.currency;
  const rows = ledgerRows(partyId, kind).filter(r=>r.currency===currency);
  return rows.length ? rows[rows.length-1].balance : 0;
}

function render(){
  const app = document.getElementById('app');
  // Typing in a filter/search box (e.g. the Documents search field) triggers a full
  // re-render on every keystroke. Without this, rebuilding app.innerHTML replaces the
  // focused <input> with a new DOM node and the browser drops focus/cursor — you'd have
  // to re-click the field for every character typed. Capture + restore focus & cursor
  // position around the rebuild so typing stays continuous.
  const active = document.activeElement;
  let focusInfo = null;
  if(active && active.id && app.contains(active)){
    focusInfo = { id: active.id, start: active.selectionStart, end: active.selectionEnd };
  }
  app.innerHTML = `${sidebarHTML()}<div class="sidebar-backdrop ${sidebarOpen?'show':''}" id="sidebarBackdrop"></div><div id="main">${topbarHTML()}<div class="content">${pageHTML()}</div></div>`;
  attachGlobalHandlers();
  if(focusInfo){
    const el = document.getElementById(focusInfo.id);
    if(el){
      el.focus();
      if(focusInfo.start!=null && typeof el.setSelectionRange==='function'){
        try{ el.setSelectionRange(focusInfo.start, focusInfo.end); }catch(e){}
      }
    }
  }
}

/* ---------- Dashboard ---------- */
function dashboardHTML(){
  const base = state.settings.currency;
  // Sum every party's AR / AP balance separately — a party that's both your customer and
  // supplier contributes to both totals independently, never double-counted or netted together.
  const totalRecv = state.parties.reduce((s,p)=>{ const b=partyBalance(p.id,'AR',base); return s+(b>0?b:0); },0);
  const totalPay = state.parties.reduce((s,p)=>{ const b=partyBalance(p.id,'AP',base); return s+(b>0?b:0); },0);
  const otherCcyDocs = state.documents.filter(d=>!d.voided && docCurrency(d)!==base && MONEY_DOC_TYPES.includes(d.type)).length;
  const overdueDocs = state.documents.filter(d=>d.type==='INV' && !d.voided && docStatus(d)==='overdue' && docCurrency(d)===base);
  const overdueTotal = overdueDocs.reduce((s,d)=>s+docTotals(d).total - docPaidAmount(d),0);
  const cashBalance = cashBalanceFor(base);
  const thisMonth = pnlForYear(new Date().getFullYear())[new Date().getMonth()];
  const recent = [...state.documents, ...state.payments].filter(d=>!d.voided).sort((a,b)=>b.date.localeCompare(a.date) || (b.createdAt-a.createdAt)).slice(0,8);

  return `
  <div class="stat-grid">
    <div class="stat-card"><div class="stat-label">Total Receivables (${base})</div><div class="stat-value receivable">${fmtMoney(totalRecv)}</div></div>
    <div class="stat-card"><div class="stat-label">Total Payables (${base})</div><div class="stat-value payable">${fmtMoney(totalPay)}</div></div>
    <div class="stat-card"><div class="stat-label">Overdue Invoices (${base})</div><div class="stat-value overdue">${fmtMoney(overdueTotal)}</div></div>
    <div class="stat-card" style="cursor:pointer" data-nav="cash"><div class="stat-label">Cash & Bank Balance (${base})</div><div class="stat-value" style="color:${cashBalance<0?'var(--danger)':'var(--success)'}">${fmtMoney(cashBalance)}</div></div>
    <div class="stat-card" style="cursor:pointer" data-nav="reports"><div class="stat-label">Net Profit — this month (${base})</div><div class="stat-value" style="color:${thisMonth.netProfit<0?'var(--danger)':'var(--success)'}">${fmtMoney(thisMonth.netProfit)}</div></div>
  </div>
  ${otherCcyDocs>0? `<div class="hint" style="margin-bottom:14px;">+ ${otherCcyDocs} document(s) in other currencies — see Statement of Account or Aging Report per party for those balances.</div>`:''}
  <div class="card">
    <div class="card-title">Recent activity</div>
    ${recent.length===0 ? emptyState('No activity yet','Create your first document to see it here.') : `
    <div class="table-scroll"><table><thead><tr><th>Date</th><th>Type</th><th>Number</th><th>Party</th><th class="num">Amount</th><th>Status</th></tr></thead>
    <tbody>${recent.map(d=>{
      const isPayment = d.type==='RCT' || d.type==='PMT';
      const amt = isPayment ? Number(d.amount) : docTotals(d).total;
      const ccy = isPayment ? (d.currency||base) : docCurrency(d);
      const status = isPayment ? 'sent' : docStatus(d);
      return `<tr style="cursor:pointer" data-open="${d.id}" data-kind="${isPayment?'payment':'doc'}">
        <td>${fmtDate(d.date)}</td><td><span class="doc-tag tag-${d.type}">${d.type}</span></td>
        <td>${d.number}</td><td>${escapeHtml(partyName(d.partyId))}</td>
        <td class="num">${fmtMoney(amt, ccy)}</td>
        <td>${isPayment?'':`<span class="badge ${badgeClass(status)}">${status}</span>`}</td>
      </tr>`;
    }).join('')}</tbody></table></div>`}
  </div>`;
}

let docFilter = { type:'all', status:'all', q:'' };
function documentsHTML(){
  let docs = [...state.documents];
  if(docFilter.type!=='all') docs = docs.filter(d=>d.type===docFilter.type);
  if(docFilter.status!=='all') docs = docs.filter(d=>docStatus(d)===docFilter.status);
  if(docFilter.q) docs = docs.filter(d=> (d.number+partyName(d.partyId)).toLowerCase().includes(docFilter.q.toLowerCase()));
  docs.sort((a,b)=>b.date.localeCompare(a.date));

  // Subtotal of whatever's currently filtered/searched, grouped by currency (docs can be
  // in more than one currency, so a single sum could be misleading).
  const subtotals = {};
  docs.forEach(d=>{ const ccy = docCurrency(d); subtotals[ccy] = (subtotals[ccy]||0) + docTotals(d).total; });
  const subCcys = Object.keys(subtotals);

  return `
  <div class="toolbar">
    <div class="filters">
      <select id="fType">
        <option value="all">All types</option>
        ${Object.keys(DOC_LABELS).map(t=>`<option value="${t}" ${docFilter.type===t?'selected':''}>${DOC_LABELS[t]}</option>`).join('')}
      </select>
      <select id="fStatus">
        <option value="all">All statuses</option>

/* ---------- Aging report ---------- */
let agingTab = 'receivables';
function agingHTML(){
  const isRecv = agingTab==='receivables';
  const type = isRecv ? 'INV' : 'PINV';
  const docs = state.documents.filter(d=>d.type===type && !d.voided);
  const rowsByParty = {};
  docs.forEach(d=>{
    const t = docTotals(d); const paid = docPaidAmount(d); const outstanding = t.total - paid;
    if(outstanding <= 0.005) return;
    const due = d.dueDate || d.date;
    const days = daysBetween(due, todayStr());
    let bucket = 'current';
    if(days>90) bucket='b3'; else if(days>60) bucket='b2'; else if(days>30) bucket='b1'; else if(days>0) bucket='current';
    else bucket='current';
    if(days>0 && days<=30) bucket='b0';
    const key = d.partyId;
    if(!rowsByParty[key]) rowsByParty[key] = {current:0,b0:0,b1:0,b2:0,b3:0,total:0,ccy:docCurrency(d)};
    rowsByParty[key][bucket] += outstanding; rowsByParty[key].total += outstanding;
  });
  const partyIds = Object.keys(rowsByParty);
  const grand = {current:0,b0:0,b1:0,b2:0,b3:0,total:0};
  partyIds.forEach(id=>{ const r=rowsByParty[id]; grand.current+=r.current; grand.b0+=r.b0; grand.b1+=r.b1; grand.b2+=r.b2; grand.b3+=r.b3; grand.total+=r.total; });

  return `
  <div class="tabs">
    <div class="tab ${isRecv?'active':''}" data-agingtab="receivables">Receivables (customers)</div>
    <div class="tab ${!isRecv?'active':''}" data-agingtab="payables">Payables (suppliers)</div>
  </div>
  <div class="card" style="padding:0;">
    ${partyIds.length===0 ? emptyState('Nothing outstanding', isRecv? 'No unpaid invoices right now.':'No unpaid purchase bills right now.') : `
    <div class="table-scroll"><table><thead><tr><th>Party</th><th class="num">Not yet due</th><th class="num">1–30 days</th><th class="num">31–60 days</th><th class="num">61–90 days</th><th class="num">90+ days</th><th class="num">Total</th></tr></thead>
    <tbody>${partyIds.map(id=>{ const r = rowsByParty[id];
      return `<tr style="cursor:pointer" data-soa="${id}">
        <td style="font-weight:600">${escapeHtml(partyName(id))}</td>
        <td class="num">${r.current? fmtMoney(r.current,r.ccy):'—'}</td>
        <td class="num aging-bucket bucket-current">${r.b0? fmtMoney(r.b0,r.ccy):'—'}</td>
        <td class="num aging-bucket bucket-1">${r.b1? fmtMoney(r.b1,r.ccy):'—'}</td>
        <td class="num aging-bucket bucket-2">${r.b2? fmtMoney(r.b2,r.ccy):'—'}</td>
        <td class="num aging-bucket bucket-3">${r.b3? fmtMoney(r.b3,r.ccy):'—'}</td>
        <td class="num" style="font-weight:700">${fmtMoney(r.total,r.ccy)}</td>
      </tr>`;}).join('')}
      <tr><td style="font-weight:700">Total</td>
        <td class="num" style="font-weight:700">${fmtMoney(grand.current)}</td>
        <td class="num" style="font-weight:700">${fmtMoney(grand.b0)}</td>
        <td class="num" style="font-weight:700">${fmtMoney(grand.b1)}</td>
        <td class="num" style="font-weight:700">${fmtMoney(grand.b2)}</td>
        <td class="num" style="font-weight:700">${fmtMoney(grand.b3)}</td>
        <td class="num" style="font-weight:700">${fmtMoney(grand.total)}</td>
      </tr>
    </tbody></table></div>
    <div class="hint" style="padding:12px 16px;">Totals mix currencies if you use more than one — open a party's Statement of Account for exact per-currency figures.</div>`}
  </div>`;
}

/* ---------- Profit & Loss / Purchases report ---------- */
let reportsYear = new Date().getFullYear();
let reportsItemFilter = 'all';
const PNL_EXCLUDE_CATEGORIES = ['Owner capital','Loan received','Owner drawings','Bank fees'];
function monthKey(dateStr){ return (dateStr||'').slice(0,7); } // "YYYY-MM"
function pnlForYear(year){
  const base = state.settings.currency;
  const months = Array.from({length:12}, (_,i)=>({
    key: `${year}-${String(i+1).padStart(2,'0')}`, label: new Date(year,i,1).toLocaleString(undefined,{month:'short'}),
    revenue:0, purchases:0, otherIncome:0, opEx:0,
  }));
  const byKey = {}; months.forEach(m=>byKey[m.key]=m);

  state.documents.filter(d=>!d.voided && docCurrency(d)===base && d.date && d.date.slice(0,4)===String(year)).forEach(d=>{
    const m = byKey[monthKey(d.date)]; if(!m) return;
    const subtotal = docTotals(d).subtotal;
    if(d.type==='INV' || d.type==='DN') m.revenue += subtotal;
    else if(d.type==='CN') m.revenue -= subtotal;
    else if(d.type==='PINV') m.purchases += subtotal;
  });

  state.cashMovements.filter(c=>!c.voided && !c.linkedPaymentId && (c.currency||base)===base && c.date && c.date.slice(0,4)===String(year)).forEach(c=>{
    if(PNL_EXCLUDE_CATEGORIES.includes(c.category)) return;
    const m = byKey[monthKey(c.date)]; if(!m) return;
    if(c.direction==='in') m.otherIncome += Number(c.amount)||0;
    else m.opEx += Number(c.amount)||0;
  });

  months.forEach(m=>{
    m.grossProfit = m.revenue - m.purchases;
    m.netProfit = m.grossProfit + m.otherIncome - m.opEx;
  });
  return months;
}
function purchaseQtyForYear(year){
  const rows = {}; // itemCode -> {unit, byMonth:{1..12: qty}}
  state.documents.filter(d=>d.type==='PINV' && !d.voided && d.date && d.date.slice(0,4)===String(year)).forEach(d=>{
    const mIdx = Number(d.date.slice(5,7));
    (d.items||[]).forEach(it=>{
      if(!it.itemCode) return;
      if(!rows[it.itemCode]) rows[it.itemCode] = { itemCode: it.itemCode, unit: it.unit||'g', byMonth: {} };
      rows[it.itemCode].byMonth[mIdx] = (rows[it.itemCode].byMonth[mIdx]||0) + (Number(it.qty)||0);
    });
  });
  return rows;
}

    <div class="table-scroll"><table><thead><tr><th>Month</th><th class="num">Revenue</th><th class="num">Purchases</th><th class="num">Gross Profit</th><th class="num">Other Income</th><th class="num">Op. Expenses</th><th class="num">Net Profit</th></tr></thead>

    <tr><td style="font-weight:700">Total ${reportsYear}</td>

  </div>

    <tbody>${list.map(r=>{ const t = recurTotals(r);
      return `<tr>
        <td style="font-weight:600">${escapeHtml(partyName(r.partyId))}</td>
        <td style="text-transform:capitalize">${r.frequency}</td>
        <td class="num">${fmtMoney(t.total, r.currency)}</td>

        <td><span class="badge ${r.active?'badge-sent':'badge-draft'}">${r.active?'active':'paused'}</span></td>

function recurTotals(r){
  const subtotal = r.items.reduce((s,it)=>s+lineAmount(it),0);
  const tax = subtotal*(Number(r.taxRate)||0)/100;
  return {subtotal, tax, total: subtotal+tax};
}

/* ================= Items editor (shared by Document modal & Recurring modal) ================= */
function itemsEditorHTML(){
  return `<div class="table-scroll"><table class="items-table"><thead><tr>
    <th class="colNo">No</th><th class="colCode">Item code</th><th class="colDesc">Description</th>
    <th class="colQty">Qty</th><th class="colUnit">Unit</th><th class="colPrice">Price/unit</th><th class="colDisc">Discount</th><th class="colAmt">Amount</th><th></th>
  </tr></thead><tbody id="itemsBody"></tbody></table></div>
  <button class="btn btn-sm btn-ghost" id="addItemBtn" style="margin-top:6px;">${icon('plus')} Add line</button>
  <div class="totals-box" id="totalsBox"></div>`;
}
function mountItemsEditor(items, getTaxRate, getCurrency, onTotalsChange){
  const cat = state.settings.itemCatalog;
  function codeOptions(sel){ return `<option value="">—</option>` + cat.codes.map(c=>`<option value="${c.code}" ${c.code===sel?'selected':''}>${c.code}</option>`).join(''); }
  function optList(arr, sel){ return `<option value="">—</option>` + arr.map(v=>`<option value="${escapeAttr(v)}" ${v===sel?'selected':''}>${escapeHtml(v)}</option>`).join(''); }

  function renderItems(){
    const tbody = document.getElementById('itemsBody');
    if(!tbody) return;
    tbody.innerHTML = items.map((it,i)=>`
      <tr>
        <td class="colNo">${i+1}</td>
        <td class="colCode">
          <select data-i="${i}" class="it-code">${codeOptions(it.itemCode)}</select>
          <div style="display:flex;gap:3px;margin-top:3px;">
            <select data-i="${i}" class="it-grade" style="flex:1">${optList(gradesForCode(it.itemCode), it.grade)}</select>
            <select data-i="${i}" class="it-color" style="flex:1">${optList(cat.colors, it.color)}</select>
          </div>
        </td>
        <td class="colDesc"><input data-i="${i}" class="it-desc" value="${escapeAttr(it.desc)}" placeholder="Description"></td>
        <td class="colQty"><input data-i="${i}" class="it-qty" type="number" step="0.01" value="${Number(it.qty||0).toFixed(2)}"></td>
        <td class="colUnit"><select data-i="${i}" class="it-unit">${optList(cat.units, it.unit||'g')}</select></td>
        <td class="colPrice"><input data-i="${i}" class="it-price" type="number" step="0.001" value="${Number(it.price||0).toFixed(3)}"></td>
        <td class="colDisc"><div class="disc-wrap">
          <input data-i="${i}" class="it-disc" type="number" step="0.01" value="${Number(it.discount||0).toFixed(2)}">
          <select data-i="${i}" class="it-disctype"><option value="abs" ${it.discountType!=='pct'?'selected':''}>amt</option><option value="pct" ${it.discountType==='pct'?'selected':''}>%</option></select>
        </div></td>
        <td class="colAmt">${fmtMoney(lineAmount(it), getCurrency())}</td>
        <td><button class="icon-btn" data-rm="${i}">${icon('x')}</button></td>
      </tr>`).join('');

    tbody.querySelectorAll('.it-code').forEach(el=>el.addEventListener('change',e=>{
      const i=+e.target.dataset.i; items[i].itemCode=e.target.value;
      if(items[i]._autoDesc!==false) items[i].desc = composeDesc(items[i].itemCode, items[i].grade, items[i].color);
      renderItems(); renderTotals();
    }));
    tbody.querySelectorAll('.it-grade').forEach(el=>el.addEventListener('change',e=>{
      const i=+e.target.dataset.i; items[i].grade=e.target.value;
      if(items[i]._autoDesc!==false) items[i].desc = composeDesc(items[i].itemCode, items[i].grade, items[i].color);
      renderItems(); renderTotals();
    }));
    tbody.querySelectorAll('.it-color').forEach(el=>el.addEventListener('change',e=>{
      const i=+e.target.dataset.i; items[i].color=e.target.value;
      if(items[i]._autoDesc!==false) items[i].desc = composeDesc(items[i].itemCode, items[i].grade, items[i].color);
      renderItems(); renderTotals();
    }));
    tbody.querySelectorAll('.it-desc').forEach(el=>el.addEventListener('input',e=>{
      const i=+e.target.dataset.i; items[i].desc=e.target.value; items[i]._autoDesc=false;
    }));
    // Qty/price/discount are typed character-by-character, so on every keystroke we only
    // patch that row's amount cell + the totals box — never rebuild the table itself.
    // Rebuilding the <input> node on every keystroke (via renderItems()) was what forced
    // you to re-click the cell for every digit.
    function patchRow(el){
      const i=+el.dataset.i;
      const row = el.closest('tr'); const cell = row && row.querySelector('.colAmt');
      if(cell) cell.textContent = fmtMoney(lineAmount(items[i]), getCurrency());
    }
    tbody.querySelectorAll('.it-qty').forEach(el=>el.addEventListener('input',e=>{ items[+e.target.dataset.i].qty=e.target.value; patchRow(e.target); renderTotals(); }));
    tbody.querySelectorAll('.it-unit').forEach(el=>el.addEventListener('change',e=>{ items[+e.target.dataset.i].unit=e.target.value; }));
    tbody.querySelectorAll('.it-price').forEach(el=>el.addEventListener('input',e=>{ items[+e.target.dataset.i].price=e.target.value; patchRow(e.target); renderTotals(); }));
    tbody.querySelectorAll('.it-disc').forEach(el=>el.addEventListener('input',e=>{ items[+e.target.dataset.i].discount=e.target.value; patchRow(e.target); renderTotals(); }));
    tbody.querySelectorAll('.it-disctype').forEach(el=>el.addEventListener('change',e=>{ items[+e.target.dataset.i].discountType=e.target.value; renderItems(); renderTotals(); }));
    tbody.querySelectorAll('[data-rm]').forEach(el=>el.addEventListener('click',e=>{ items.splice(+e.currentTarget.dataset.rm,1); renderItems(); renderTotals(); }));
  }
  function renderTotals(){
    const taxRate = getTaxRate();
    const subtotal = items.reduce((s,it)=>s+lineAmount(it),0);
    const tax = subtotal*taxRate/100;
    const box = document.getElementById('totalsBox');
    if(box) box.innerHTML = `
      <div class="totals-row"><span>Subtotal</span><span>${fmtMoney(subtotal, getCurrency())}</span></div>
      <div class="totals-row"><span>Tax (${taxRate}%)</span><span>${fmtMoney(tax, getCurrency())}</span></div>
      <div class="totals-row grand"><span>Total</span><span>${fmtMoney(subtotal+tax, getCurrency())}</span></div>`;
    if(onTotalsChange) onTotalsChange();
  }
  renderItems(); renderTotals();
  const addBtn = document.getElementById('addItemBtn');
  if(addBtn) addBtn.onclick = ()=>{ items.push({desc:'',qty:1,price:0,discount:0,discountType:'abs',unit:'g',_autoDesc:true}); renderItems(); renderTotals(); };
  return { renderItems, renderTotals };
}

/* ================= Modal: Document editor ================= */
function openDocModal(existingId, presetType, presetPartyId, sourceDocId){
  const editing = existingId ? state.documents.find(d=>d.id===existingId) : null;
  const type = editing ? editing.type : (presetType || 'INV');
  const doc = editing ? JSON.parse(JSON.stringify(editing)) : {
    id: uid(), type, number: null, date: todayStr(), dueDate: '',
    partyId: presetPartyId || '', currency: state.settings.currency,
    items: [{desc:'', qty:1, price:0, discount:0, discountType:'abs', unit:'g', _autoDesc:true}],
    taxRate: (type==='DO'||type==='QT'||type==='PO')?0:state.settings.taxRate, notes:'',
    status:'sent', linkedFrom: sourceDocId||null, createdAt: Date.now(), voided:false,
  };
  if(sourceDocId){
    const src = state.documents.find(d=>d.id===sourceDocId);
    if(src){ doc.partyId = src.partyId; doc.items = JSON.parse(JSON.stringify(src.items)); doc.taxRate = (type==='DO')?0:src.taxRate; doc.currency = src.currency; doc.linkedFrom = src.id; }
  }
  if(!editing && !doc.partyId){ const relevant = state.parties.filter(p => type==='PINV'||type==='PO' ? p.type!=='customer' : p.type!=='supplier'); doc.partyId = (relevant[0]&&relevant[0].id) || ''; }
  const relevantParties = state.parties.filter(p => (type==='PINV'||type==='PO') ? p.type!=='customer' : p.type!=='supplier');
  const isPreDoc = type==='DO' || type==='QT' || type==='PO';

  const html = `
  <div class="modal-overlay" id="docModalOverlay">
    <div class="modal wide">
      <div class="modal-head">
        <div class="modal-title">${editing? (editing.number || 'Edit document') : 'New '+DOC_LABELS[type]}</div>
        <button class="icon-btn" id="closeDocModal">${icon('x')}</button>
      </div>
      <div class="modal-body">
        <div class="row">
          <div class="field"><label>Document type</label>
            <select id="d_type" disabled><option value="${type}">${DOC_LABELS[type]}</option></select>
          </div>
          <div class="field"><label>${(type==='PINV'||type==='PO')?'Supplier':'Party'}</label>
            <select id="d_party">
              ${relevantParties.length===0? '<option value="">No parties yet — add one first</option>' :
                relevantParties.map(p=>`<option value="${p.id}" ${p.id===doc.partyId?'selected':''}>${escapeHtml(p.name)}</option>`).join('')}
            </select>
          </div>
          <div class="field"><label>Currency</label>
            <select id="d_currency">${state.settings.currencies.map(c=>`<option value="${c}" ${c===doc.currency?'selected':''}>${c}</option>`).join('')}</select>
          </div>
        </div>
        <div class="row">
          <div class="field"><label>Date</label><input id="d_date" type="date" value="${doc.date}"></div>
          <div class="field"><label>Due date ${isPreDoc?'(n/a)':''}</label><input id="d_due" type="date" value="${doc.dueDate||''}" ${isPreDoc?'disabled':''}></div>
          <div class="field"><label>Tax rate (%)</label><input id="d_tax" type="number" step="0.01" value="${doc.taxRate}" ${isPreDoc?'disabled':''}></div>
        </div>
        <label>Line items</label>
        ${itemsEditorHTML()}
        <div class="field" style="margin-top:14px;"><label>Notes / terms</label><textarea id="d_notes" rows="2">${escapeHtml(doc.notes||'')}</textarea></div>
      </div>
      <div class="modal-foot">
        ${editing? `<button class="btn btn-danger" id="voidDocBtn" style="margin-right:auto">${doc.voided?'Restore':'Void'}</button>` : ''}
        <button class="btn" id="cancelDocBtn">Cancel</button>
        <button class="btn btn-primary" id="saveDocBtn">${editing?'Save changes':'Create & assign number'}</button>
      </div>
    </div>
  </div>`;
  injectModal(html);

  const items = doc.items;
  const ctrl = mountItemsEditor(items, ()=>Number(document.getElementById('d_tax').value)||0, ()=>document.getElementById('d_currency').value);
  document.getElementById('d_tax').addEventListener('input', ctrl.renderTotals);
  document.getElementById('d_currency').addEventListener('change', ()=>{ ctrl.renderItems(); ctrl.renderTotals(); });
  document.getElementById('closeDocModal').onclick = closeModal;
  document.getElementById('cancelDocBtn').onclick = closeModal;

  if(editing){
    document.getElementById('voidDocBtn').onclick = async ()=>{
      recordStockMovements(editing, !editing.voided ? false : true); // reverse current effect
      editing.voided = !editing.voided;
      await Promise.all([saveDocuments(), saveStock()]);
      toast(editing.voided? 'Document voided':'Document restored'); closeModal(); render();
    };
  }

  document.getElementById('saveDocBtn').onclick = async ()=>{
    const partySel = document.getElementById('d_party');
    if(!partySel.value){ toast('Add a customer/supplier first'); return; }
    doc.partyId = partySel.value;
    doc.currency = document.getElementById('d_currency').value;
    doc.date = document.getElementById('d_date').value || todayStr();
    doc.dueDate = document.getElementById('d_due').value;
    doc.taxRate = Number(document.getElementById('d_tax').value)||0;
    doc.notes = document.getElementById('d_notes').value;
    doc.items = items.filter(it=>it.desc || Number(it.qty) || Number(it.price));
    if(doc.items.length===0) doc.items = [{desc:'(no description)',qty:1,price:0,discount:0,discountType:'abs',unit:'g'}];

    if(editing){
      const idx = state.documents.findIndex(d=>d.id===editing.id);
      state.documents[idx] = doc;
      await saveDocuments();
      toast('Document updated');
      closeModal(); render();
    } else {
      const saveBtn = document.getElementById('saveDocBtn');
      saveBtn.disabled = true; saveBtn.textContent = 'Creating…';
      try{
        doc.number = await getNextNumber(doc.type);
      }catch(e){ saveBtn.disabled = false; saveBtn.textContent = 'Create & assign number'; return; }
      doc.status = 'sent';
      state.documents.push(doc);
      recordStockMovements(doc, false);
      await Promise.all([saveDocuments(), saveStock()]);
      toast(`${doc.number} created`);
      closeModal(); render();
    }
  };
}

/* ================= Modal: Bulk payment (knock off several bills at once) ================= */
function openBulkPaymentModal(partyId, kind){ // kind: 'AR' = receipts from a customer, 'AP' = payments to a supplier
  const party = partyById(partyId);
  const rows = outstandingDocsFor(partyId, kind);
  if(rows.length===0){ toast('Nothing outstanding for this party'); return; }
  const ccys = [...new Set(rows.map(r=>r.ccy))];
  let currentCcy = ccys[0];
  const ptype = kind==='AR' ? 'RCT' : 'PMT';

  function rowsForCcy(){ return rows.filter(r=>r.ccy===currentCcy); }
  function wireRowEvents(){
    document.querySelectorAll('.bp-check').forEach(el=>el.addEventListener('change', e=>{
      const id = e.target.dataset.id;
      const alloc = document.querySelector(`.bp-alloc[data-id="${id}"]`);
      const r = rows.find(x=>x.doc.id===id);
      if(alloc){ alloc.disabled = !e.target.checked; alloc.value = e.target.checked ? r.balance.toFixed(2) : '0.00'; }
      updateSummary();
    }));
    document.querySelectorAll('.bp-alloc').forEach(el=>el.addEventListener('input', updateSummary));
  }
  function updateSummary(){
    const total = [...document.querySelectorAll('.bp-alloc')].reduce((s,el)=> s + (el.disabled?0:(Number(el.value)||0)), 0);
    const box = document.getElementById('bulkPaySummary');
    if(box) box.textContent = `Total to record: ${fmtMoney(total, currentCcy)}`;
  }
  function renderTable(){
    const list = rowsForCcy();
    const tbody = document.getElementById('bulkPayBody');
    if(!tbody) return;
    tbody.innerHTML = list.map(r=>`<tr>
      <td><input type="checkbox" class="bp-check" data-id="${r.doc.id}" checked></td>
      <td style="font-weight:600">${r.doc.number}</td>
      <td>${fmtDate(r.doc.date)}</td>
      <td class="num">${fmtMoney(r.balance, r.ccy)}</td>
      <td class="num"><input type="number" step="0.01" min="0" class="bp-alloc" data-id="${r.doc.id}" value="${r.balance.toFixed(2)}" style="width:110px;text-align:right"></td>
    </tr>`).join('');
    wireRowEvents(); updateSummary();
  }
  function autoAllocate(amount){
    let remaining = Math.max(0, amount);
    rowsForCcy().forEach(r=>{
      const alloc = document.querySelector(`.bp-alloc[data-id="${r.doc.id}"]`);
      const check = document.querySelector(`.bp-check[data-id="${r.doc.id}"]`);
      if(!alloc || !check) return;
      const take = Math.max(0, Math.min(r.balance, remaining));
      alloc.value = take.toFixed(2);
      alloc.disabled = take<=0;
      check.checked = take>0;
      remaining -= take;
    });
    updateSummary();
  }

  const totalOutstanding = rowsForCcy().reduce((s,r)=>s+r.balance,0);
  const html = `<div class="modal-overlay" id="bulkPayOverlay"><div class="modal wide">
    <div class="modal-head"><div class="modal-title">Knock off ${kind==='AR'?'receivables':'payables'} — ${escapeHtml(party.name)}</div><button class="icon-btn" id="closeBulkPay">${icon('x')}</button></div>
    <div class="modal-body">
      <div class="row">
        <div class="field"><label>Date</label><input id="bp_date" type="date" value="${todayStr()}"></div>
        <div class="field"><label>Method</label><select id="bp_method">${paymentMethods().map(m=>`<option value="${escapeAttr(m)}">${escapeHtml(m)}</option>`).join('')}</select></div>
        ${ccys.length>1 ? `<div class="field"><label>Currency</label><select id="bp_ccy">${ccys.map(c=>`<option value="${c}">${c}</option>`).join('')}</select></div>` : ''}
      </div>
      <div class="row">
        <div class="field"><label>${kind==='AR'?'Amount received':'Amount paid'}</label><input id="bp_amount" type="number" step="0.01" min="0" value="${totalOutstanding.toFixed(2)}"></div>
        <div class="field" style="justify-content:flex-end;"><label>&nbsp;</label><button class="btn btn-sm" id="bp_autoBtn" type="button">Auto-allocate, oldest first</button></div>
      </div>
      <div class="hint" style="margin:4px 0 10px;">Tick which bills to include, or type an amount straight into "Allocate" for any bill — unticking a bill zeroes it out. "Auto-allocate" fills the oldest bills first up to the amount above.</div>
      <div class="table-scroll"><table><thead><tr><th></th><th>Number</th><th>Date</th><th class="num">Balance</th><th class="num">Allocate</th></tr></thead>
      <tbody id="bulkPayBody"></tbody></table></div>
      <div id="bulkPaySummary" style="margin-top:10px;font-weight:700;"></div>
    </div>
    <div class="modal-foot"><button class="btn" id="cancelBulkPay">Cancel</button><button class="btn btn-primary" id="saveBulkPay">Record payments</button></div>
  </div></div>`;
  injectModal(html);
  renderTable();
  document.getElementById('closeBulkPay').onclick = closeModal;
  document.getElementById('cancelBulkPay').onclick = closeModal;
  document.getElementById('bp_autoBtn').onclick = ()=> autoAllocate(Number(document.getElementById('bp_amount').value)||0);
  const bpCcy = document.getElementById('bp_ccy');
  if(bpCcy) bpCcy.onchange = e=>{
    currentCcy = e.target.value;
    document.getElementById('bp_amount').value = rowsForCcy().reduce((s,r)=>s+r.balance,0).toFixed(2);
    renderTable();
  };

  document.getElementById('saveBulkPay').onclick = async ()=>{
    const allocations = rowsForCcy().map(r=>{
      const el = document.querySelector(`.bp-alloc[data-id="${r.doc.id}"]`);
      const amt = el && !el.disabled ? Number(el.value)||0 : 0;
      return { r, amt };
    }).filter(x=>x.amt > 0.005);
    if(allocations.length===0){ toast('Allocate an amount to at least one bill'); return; }
    for(const a of allocations){ if(a.amt - a.r.balance > 0.005){ toast(`${a.r.doc.number}: allocation can't exceed its balance`); return; } }

    const btn = document.getElementById('saveBulkPay'); btn.disabled = true; btn.textContent = 'Recording…';
    const date = document.getElementById('bp_date').value || todayStr();
    const method = document.getElementById('bp_method').value;
    const newPayments = [], newCash = [];
    try{
      for(const a of allocations){
        const number = await getNextNumber(ptype);
        const pay = { id:uid(), type:ptype, number, date, partyId, amount:a.amt, currency:currentCcy, method, linkedDocId:a.r.doc.id, voided:false, createdAt:Date.now() };
        const cashEntry = { id:uid(), date, direction: ptype==='RCT'?'in':'out',
          category: ptype==='RCT'?'Sales receipt':'Supplier payment', method,
          currency: currentCcy, description: `${pay.number} — ${party.name} (${a.r.doc.number})`,
          amount: a.amt, voided:false, createdAt: Date.now(), linkedPaymentId: pay.id };
        pay.linkedCashId = cashEntry.id;
        newPayments.push(pay); newCash.push(cashEntry);
      }
    }catch(e){ btn.disabled = false; btn.textContent = 'Record payments'; toast('Something went wrong getting the next number — try again'); return; }
    state.payments.push(...newPayments);
    state.cashMovements.push(...newCash);
    await Promise.all([savePayments(), saveCash()]);
    toast(`${allocations.length} bill(s) knocked off — ${fmtMoney(allocations.reduce((s,a)=>s+a.amt,0), currentCcy)} recorded`);
    closeModal(); render();
  };
}

function emailDocLink(doc){
  const party = partyById(doc.partyId);
  const subject = encodeURIComponent(`${DOC_LABELS[doc.type]} ${doc.number} from ${state.settings.companyName}`);
  const body = encodeURIComponent(`Dear ${party?party.name:''},\n\nPlease find enclosed ${DOC_LABELS[doc.type]} ${doc.number} dated ${fmtDate(doc.date)} for ${fmtMoney(docTotals(doc).total, docCurrency(doc))}.\n\n(Print or save this document as a PDF and attach it here — browsers can't attach files automatically.)\n\nThank you,\n${state.settings.companyName}`);
  return `mailto:${party&&party.email||''}?subject=${subject}&body=${body}`;
}
function whatsappDocLink(doc){
  const party = partyById(doc.partyId);
  const phone = (party&&party.phone||'').replace(/[^0-9]/g,'');
  const text = encodeURIComponent(`${DOC_LABELS[doc.type]} ${doc.number} dated ${fmtDate(doc.date)}\nAmount: ${fmtMoney(docTotals(doc).total, docCurrency(doc))}\nFrom: ${state.settings.companyName}`);
  return `https://wa.me/${phone}?text=${text}`;
}

      <div class="field"><label>Date</label><div>${fmtDate(p.date)}</div></div>

      <div class="field"><label>Method</label><div>${p.method}</div></div>
      ${p.linkedDocId? `<div class="field"><label>Linked document</label><div>${(state.documents.find(d=>d.id===p.linkedDocId)||{}).number||'—'}</div></div>`:''}

      <button class="btn btn-primary" id="donePayBtn">Done</button>

  </div></div>`;

    toast(p.voided?'Voided':'Restored'); closeModal(); render();
  };
}

function advanceDate(dateStr, freq){
  const d = new Date(dateStr+'T00:00:00');
  if(freq==='weekly') d.setDate(d.getDate()+7);
  else if(freq==='monthly') d.setMonth(d.getMonth()+1);
  else if(freq==='quarterly') d.setMonth(d.getMonth()+3);
  else if(freq==='yearly') d.setFullYear(d.getFullYear()+1);
  return d.toISOString().slice(0,10);
}
async function runRecurringCheck(){
  let generated = 0;
  let touchedDocs = false, touchedRecur = false;
  for(const r of state.recurring){
    if(!r.active) continue;
    let guard = 0;
    while(r.nextRunDate <= todayStr() && guard < 24){
      const number = await getNextNumber('INV');
      const doc = { id:uid(), type:'INV', number, date:r.nextRunDate, dueDate:r.nextRunDate,
        partyId:r.partyId, currency:r.currency, items: JSON.parse(JSON.stringify(r.items)), taxRate:r.taxRate,
        notes: r.notes, status:'sent', linkedFrom:null, createdAt: Date.now(), voided:false, fromRecurring:r.id };
      state.documents.push(doc); touchedDocs = true;
      r.nextRunDate = advanceDate(r.nextRunDate, r.frequency); touchedRecur = true;
      generated++; guard++;
    }
  }
  if(touchedDocs) await saveDocuments();
  if(touchedRecur) await saveRecurring();
  if(generated>0) toast(`Auto-generated ${generated} recurring invoice${generated>1?'s':''}`);
}

  document.querySelectorAll('[data-open]').forEach(el=>el.addEventListener('click',(e)=>{
    if(e.target.closest('[data-print]')) return;
    openViewModal(el.dataset.open, el.dataset.kind);
  }));
  document.querySelectorAll('[data-print]').forEach(el=>el.addEventListener('click',(e)=>{
    e.stopPropagation(); const doc = state.documents.find(d=>d.id===el.dataset.print); if(doc) printDocument(doc);
  }));
  document.querySelectorAll('[data-edit-party]').forEach(el=>el.addEventListener('click',()=>openPartyModal(el.dataset.editParty)));
  document.querySelectorAll('[data-soa]').forEach(el=>el.addEventListener('click',()=>nav('soa',{partyId:el.dataset.soa})));
  document.querySelectorAll('[data-edit-recurring]').forEach(el=>el.addEventListener('click',()=>openRecurringModal(el.dataset.editRecurring)));
  document.querySelectorAll('[data-skuhistory]').forEach(el=>el.addEventListener('click',()=>openSkuHistoryModal(el.dataset.skuhistory)));
  document.querySelectorAll('[data-agingtab]').forEach(el=>el.addEventListener('click',()=>{ agingTab = el.dataset.agingtab; render(); }));

  const fType=document.getElementById('fType'); if(fType) fType.onchange=e=>{docFilter.type=e.target.value; render();};
  const fStatus=document.getElementById('fStatus'); if(fStatus) fStatus.onchange=e=>{docFilter.status=e.target.value; render();};
  const fSearch=document.getElementById('fSearch'); if(fSearch){ fSearch.oninput=e=>{docFilter.q=e.target.value; render(); }; }
  const fPartyType=document.getElementById('fPartyType'); if(fPartyType) fPartyType.onchange=e=>{partyFilter=e.target.value; render();};
  const fCashMethod=document.getElementById('fCashMethod'); if(fCashMethod) fCashMethod.onchange=e=>{cashMethodFilter=e.target.value; render();};

  const soaSel = document.getElementById('soaPartySelect'); if(soaSel) soaSel.onchange=e=>nav('soa',{partyId:e.target.value});
  const printSoaBtn = document.getElementById('printSoaBtn'); if(printSoaBtn) printSoaBtn.onclick=()=>printSOA(route.params.partyId || state.parties[0].id);
  const bulkPayArBtn = document.getElementById('bulkPayArBtn'); if(bulkPayArBtn) bulkPayArBtn.onclick=()=>openBulkPaymentModal(route.params.partyId || state.parties[0].id, 'AR');
  const bulkPayApBtn = document.getElementById('bulkPayApBtn'); if(bulkPayApBtn) bulkPayApBtn.onclick=()=>openBulkPaymentModal(route.params.partyId || state.parties[0].id, 'AP');

  const saveCompanyBtn = document.getElementById('saveCompanyBtn');
  if(saveCompanyBtn) saveCompanyBtn.onclick = async ()=>{
    const s = state.settings;
    s.companyName=val('s_companyName'); s.regNoNew=val('s_regNoNew'); s.regNoOld=val('s_regNoOld'); s.address=val('s_address');
    s.phone=val('s_phone'); s.email=val('s_email'); s.bankName=val('s_bankName'); s.bankAccount=val('s_bankAccount');
    s.currency=val('s_currency')||'RM'; s.taxLabel=val('s_taxLabel'); s.taxRate=Number(val('s_taxRate'))||0;
    if(!s.currencies.includes(s.currency)) s.currencies.push(s.currency);
    await saveSettings(); toast('Company profile saved'); render();
  };
  const saveNumberingBtn = document.getElementById('saveNumberingBtn');
  if(saveNumberingBtn) saveNumberingBtn.onclick = async ()=>{
    document.querySelectorAll('[data-dt-prefix]').forEach(el=>{ state.settings.docTypes[el.dataset.dtPrefix].prefix = el.value.trim() || el.dataset.dtPrefix; });
    await saveSettings(); toast('Prefixes saved'); render(); refreshCounterPreviews();
  };
  const exportBtn = document.getElementById('exportBtn');
  if(exportBtn) exportBtn.onclick = ()=>{
    const blob = new Blob([JSON.stringify(state,null,2)], {type:'application/json'});
    const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'ledger-backup.json'; a.click();
  };

  // item catalog editing (settings page) — edits are staged in state.settings.itemCatalog directly, saved via button
  const addCodeBtn = document.getElementById('addCodeBtn');
  if(addCodeBtn) addCodeBtn.onclick = ()=>{ state.settings.itemCatalog.codes.push({code:'',name:''}); render(); nav('settings'); };
  document.querySelectorAll('[data-rm-code]').forEach(el=>el.addEventListener('click',()=>{ state.settings.itemCatalog.codes.splice(+el.dataset.rmCode,1); render(); }));
  document.querySelectorAll('.code-code').forEach(el=>el.addEventListener('input',e=>{ state.settings.itemCatalog.codes[+e.target.dataset.codeI].code = e.target.value; }));
  document.querySelectorAll('.code-name').forEach(el=>el.addEventListener('input',e=>{ state.settings.itemCatalog.codes[+e.target.dataset.codeI].name = e.target.value; }));

  function chipAdd(inputId, arrKey){
    const el = document.getElementById(inputId); if(!el) return;
    const v = el.value.trim().toUpperCase();
    if(v && !state.settings.itemCatalog[arrKey].includes(v)) state.settings.itemCatalog[arrKey].push(v);
    render();
  }
  const addColorBtn = document.getElementById('addColorBtn'); if(addColorBtn) addColorBtn.onclick = ()=>chipAdd('newColor','colors');
  const addUnitBtn = document.getElementById('addUnitBtn'); if(addUnitBtn) addUnitBtn.onclick = ()=>chipAdd('newUnit','units');
  document.querySelectorAll('.addGradeBtn').forEach(el=>el.addEventListener('click',()=>{
    const code = el.dataset.code;
    const input = document.querySelector(`.newGradeInput[data-code="${CSS.escape(code)}"]`); if(!input) return;
    const v = input.value.trim().toUpperCase();
    if(!v) return;
    if(!state.settings.itemCatalog.gradesByCode[code]) state.settings.itemCatalog.gradesByCode[code] = [];
    if(!state.settings.itemCatalog.gradesByCode[code].includes(v)) state.settings.itemCatalog.gradesByCode[code].push(v);
    render();
  }));
  document.querySelectorAll('[data-rm-grade]').forEach(el=>el.addEventListener('click',()=>{
    const code = el.dataset.rmGrade, i = +el.dataset.rmGradeI;
    if(state.settings.itemCatalog.gradesByCode[code]) state.settings.itemCatalog.gradesByCode[code].splice(i,1);
    render();
  }));
  document.querySelectorAll('[data-rm-color]').forEach(el=>el.addEventListener('click',()=>{ state.settings.itemCatalog.colors.splice(+el.dataset.rmColor,1); render(); }));
  document.querySelectorAll('[data-rm-unit]').forEach(el=>el.addEventListener('click',()=>{ state.settings.itemCatalog.units.splice(+el.dataset.rmUnit,1); render(); }));
  const saveCatalogBtn = document.getElementById('saveCatalogBtn');
  if(saveCatalogBtn) saveCatalogBtn.onclick = async ()=>{ await saveSettings(); toast('Item catalog saved'); render(); };

  const addMethodBtn = document.getElementById('addMethodBtn');
  if(addMethodBtn) addMethodBtn.onclick = ()=>{
    const el = document.getElementById('newMethod'); if(!el) return;
    const v = el.value.trim(); if(!v) return;
    if(!state.settings.paymentMethods) state.settings.paymentMethods = paymentMethods().slice();
    if(!state.settings.paymentMethods.includes(v)) state.settings.paymentMethods.push(v);
    render();
  };
  document.querySelectorAll('[data-rm-method]').forEach(el=>el.addEventListener('click',()=>{
    if(!state.settings.paymentMethods) state.settings.paymentMethods = paymentMethods().slice();
    state.settings.paymentMethods.splice(+el.dataset.rmMethod,1);
    render();
  }));
  const saveMethodsBtn = document.getElementById('saveMethodsBtn');
  if(saveMethodsBtn) saveMethodsBtn.onclick = async ()=>{ await saveSettings(); toast('Payment methods saved'); render(); };
}

/* ================= Boot ================= */
function renderSetupNeeded(){
  document.getElementById('app').innerHTML = `
  <div style="max-width:640px;margin:60px auto;padding:0 24px;font-size:14px;line-height:1.6;">
    <h2 style="font-size:19px;margin-bottom:4px;">One-time setup needed</h2>
    <p style="color:#6E6E73;">This app needs a free Supabase database to store your documents online. Open <code>ledger-app.html</code> in a text editor and fill in two lines near the top of the &lt;script&gt; section:</p>
    <pre style="background:#F4F4F5;border-radius:8px;padding:14px;font-size:12.5px;overflow-x:auto;">const SUPABASE_URL = "https://your-project.supabase.co";
const SUPABASE_ANON_KEY = "your-anon-public-key";</pre>
    <p style="color:#6E6E73;">You'll find both under <strong>Project Settings → API</strong> in your Supabase dashboard, after creating a free project and running the setup SQL provided with this app. Save the file and re-open it (or re-deploy it if it's already hosted).</p>
  </div>`;
}
/* Live sync: whenever anyone (any device, any team member) saves a change, Supabase
   pushes it to every open tab in real time, so you don't need to manually refresh to
   see a colleague's new invoice, and they see yours. */
async function reloadKey(key){
  const val = await dbGet(key);
  if(key==='settings') state.settings = val ? deepMerge(JSON.parse(JSON.stringify(DEFAULT_SETTINGS)), val) : state.settings;
  else if(key==='parties') state.parties = val || [];
  else if(key==='documents') state.documents = val || [];
  else if(key==='payments') state.payments = val || [];
  else if(key==='stockMovements') state.stockMovements = val || [];
  else if(key==='recurring') state.recurring = val || [];
  else if(key==='cashMovements') state.cashMovements = val || [];
}
function subscribeRealtime(){
  try{
    sb.channel('kv-sync')
      .on('postgres_changes', { event:'*', schema:'public', table:'kv_store' }, async (payload)=>{
        const key = (payload.new && payload.new.key) || (payload.old && payload.old.key);
        if(!key) return;
        await reloadKey(key);
        if(!document.getElementById('modalRoot')) render(); // don't yank the screen from under an open form
      })
      .subscribe();
  }catch(e){ console.error('realtime subscribe failed', e); }
}
async function boot(){
  if(!SUPABASE_CONFIGURED){ renderSetupNeeded(); return; }
  document.getElementById('app').innerHTML = `<div style="padding:40px;color:#6E6E73;font-size:13px;">Loading…</div>`;
  await loadAll();
  await runRecurringCheck();
  render();
  subscribeRealtime();
}
boot();
</script>
